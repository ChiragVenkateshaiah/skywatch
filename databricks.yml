# Databricks Asset Bundle — SkyWatch Lite
# Deploy:  databricks bundle deploy -t dev
# Run:     databricks bundle run skywatch_lite -t dev
# Docs:    https://docs.databricks.com/dev-tools/bundles

bundle:
  name: skywatch-lite

include:
  - resources/*.yml

sync:
  exclude:
    - "*.md"
    - ".git/**"

# Variables you may want to tweak without editing the notebooks.
variables:

  # --- Historical pipeline (src/skywatch_lite.py) ---
  date_path:
    description: ADS-B Exchange sample archive date (yyyy/mm/dd) with data present.
    default: "2024/06/01"
  n_files:
    description: Number of 5-second snapshots to ingest.
    default: "60"

  # --- Unity Catalog layout (shared) ---
  catalog:
    description: Unity Catalog catalog for the project.
    default: skywatch
  core_schema:
    description: Schema holding the landing Volume (and the older SkyWatch Lite demo tables).
    default: core
  stream_schema:
    description: >-
      Schema for the streaming Arrival Manager pipeline — bronze / silver / gold.
      ("live" is a reserved UC schema name, hence "stream".)
    default: stream
  landing_volume:
    description: UC Volume that raw poller output lands in (lives in core_schema).
    default: landing

  # --- Target airport (Arrival Manager v1 = KATL) ---
  apt_icao:
    description: ICAO code of the target airport.
    default: KATL
  apt_lat:
    description: Airport reference latitude.
    default: "33.6407"
  apt_lon:
    description: Airport reference longitude.
    default: "-84.4277"
  apt_elev_ft:
    description: Airport field elevation, ft (KATL = 1026). Used by Gold touchdown detection.
    default: "1026"
  radius_nm:
    description: Capture radius around the airport, nm (adsb.lol max 250).
    default: "250"

  # --- Live poller (src/poller.py + resources/skywatch.poller.job.yml) ---
  api_base_url:
    description: >-
      ADS-B provider base URL, joined with /<lat>/<lon>/<radius>. Default adsb.lol
      (open, no key). Any ADSB-Exchange-v2-compatible host works (adsbexchange,
      api.adsb.one, airplanes.live once approved). adsb.fi is NOT drop-in.
    default: "https://api.adsb.lol/v2/point"
  source_name:
    description: Provider tag — names the landing sub-directory and the raw `source` column.
    default: adsblol
  poll_seconds:
    description: Total duration of one polling burst. 0 = single poll per run.
    default: "270"
  poll_interval_seconds:
    description: Gap between polls within a burst (>= 1 for the API rate limit).
    default: "15"
  poller_pause_status:
    description: PAUSED or UNPAUSED — the poller schedule state on deploy.
    default: PAUSED

  # --- Historical backfill (src/backfill.py + scripts/backfill_local.py) ---
  # readsb-hist only has the 1st of each month. On Free Edition run scripts/backfill_local.py
  # off-platform instead of this job (the ~6 MB/file download would blow the quota).
  backfill_dates:
    description: Explicit YYYY-MM-DD list to backfill. Blank = backfill_months most recent 1st-of-month.
    default: ""
  backfill_months:
    description: Number of recent 1st-of-month days to backfill.
    default: "3"
  backfill_interval_s:
    description: Target seconds between snapshots.
    default: "60"
  backfill_radius_nm:
    description: Keep only aircraft within this many nm of the airport (near-field).
    default: "100"
  backfill_hours:
    description: 'UTC hour range to include, e.g. "10-04" (wraps). Blank = all 24 h.'
    default: ""

  # --- Model 1: time-to-touchdown (src/train_eta.py) ---
  eta_test_date:
    description: Held-out test day for Model 1 (the most recent backfill day).
    default: "2026-09-01"
  eta_max_evals:
    description: Hyperopt trials for Model 1 tuning.
    default: "24"
  eta_ab_table_version:
    description: >-
      Delta version of gold_arrival_tracks to A/B against (the pre-closure-fix version).
      Blank = skip the A/B cell. Get it from DESCRIBE HISTORY skywatch.stream.gold_arrival_tracks.
    default: ""

  # --- Model 2: arrival demand forecast (src/forecast_demand.py) ---
  demand_horizon_bins:
    description: Forecast horizon in 15-min bins (12 = 3 h).
    default: "12"
  demand_cut_bins:
    description: Backtest forecast-start bins per day (comma-separated).
    default: "32,44,56,68,80"
  demand_run_finetune:
    description: Fine-tune Chronos-Bolt (needs GPU + >= ~14 backfill days to be worth it).
    default: "false"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # <-- PASTE your Databricks Free Edition workspace URL here
      # (Profile 'skywatch' created by `databricks auth login` also supplies this.)
      host: https://dbc-0fadb959-36a9.cloud.databricks.com
