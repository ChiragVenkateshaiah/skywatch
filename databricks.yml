# Databricks Asset Bundle — SkyWatch Lite
# Deploy:  databricks bundle deploy -t dev
# Run:     databricks bundle run skywatch_lite -t dev
# Docs:    https://docs.databricks.com/dev-tools/bundles

bundle:
  name: skywatch-lite

include:
  - resources/*.yml

sync:
  exclude:
    - "*.md"
    - ".git/**"

# Variables you may want to tweak without editing the notebooks.
variables:

  # --- Historical pipeline (src/skywatch_lite.py) ---
  date_path:
    description: ADS-B Exchange sample archive date (yyyy/mm/dd) with data present.
    default: "2024/06/01"
  n_files:
    description: Number of 5-second snapshots to ingest.
    default: "60"

  # --- Unity Catalog layout (shared) ---
  catalog:
    description: Unity Catalog catalog for the project.
    default: skywatch
  core_schema:
    description: Schema holding the landing Volume (and the older SkyWatch Lite demo tables).
    default: core
  stream_schema:
    description: >-
      Schema for the streaming Arrival Manager pipeline — bronze / silver / gold.
      ("live" is a reserved UC schema name, hence "stream".)
    default: stream
  landing_volume:
    description: UC Volume that raw poller output lands in (lives in core_schema).
    default: landing

  # --- Target airport (Arrival Manager v1 = KATL) ---
  apt_icao:
    description: ICAO code of the target airport.
    default: KATL
  apt_lat:
    description: Airport reference latitude.
    default: "33.6407"
  apt_lon:
    description: Airport reference longitude.
    default: "-84.4277"
  apt_elev_ft:
    description: Airport field elevation, ft (KATL = 1026). Used by Gold touchdown detection.
    default: "1026"
  radius_nm:
    description: Capture radius around the airport, nm (adsb.lol max 250).
    default: "250"
  apt_aar_per_hour:
    description: >-
      Airport Acceptance Rate, arrivals/hour — the Arrival Manager App's surge threshold
      (KATL good-weather ~90). Also set in app/app.yaml env for the running app.
    default: "90"

  # --- Arrival Manager App (app/ + resources/skywatch.app.yml) ---
  warehouse_id:
    description: >-
      SQL warehouse the App reads the serving tables through (also the warehouse used for
      ad-hoc Gold builds). Get it from the SQL Warehouses page / `databricks warehouses list`.
    default: "8fd481cbf45ac93e"

  # --- Live poller (src/poller.py + resources/skywatch.poller.job.yml) ---
  api_base_url:
    description: >-
      ADS-B provider base URL, joined with /<lat>/<lon>/<radius>. Default adsb.lol
      (open, no key). Any ADSB-Exchange-v2-compatible host works (adsbexchange,
      api.adsb.one, airplanes.live once approved). adsb.fi is NOT drop-in.
    default: "https://api.adsb.lol/v2/point"
  source_name:
    description: Provider tag — names the landing sub-directory and the raw `source` column.
    default: adsblol
  poll_seconds:
    description: Total duration of one polling burst. 0 = single poll per run.
    default: "270"
  poll_interval_seconds:
    description: Gap between polls within a burst (>= 1 for the API rate limit).
    default: "15"
  poller_pause_status:
    description: PAUSED or UNPAUSED — the poller schedule state on deploy.
    default: PAUSED

  # --- Historical backfill (src/backfill.py + scripts/backfill_local.py) ---
  # readsb-hist only has the 1st of each month. On Free Edition run scripts/backfill_local.py
  # off-platform instead of this job (the ~6 MB/file download would blow the quota).
  backfill_dates:
    description: Explicit YYYY-MM-DD list to backfill. Blank = backfill_months most recent 1st-of-month.
    default: ""
  backfill_months:
    description: Number of recent 1st-of-month days to backfill.
    default: "3"
  backfill_interval_s:
    description: Target seconds between snapshots.
    default: "60"
  backfill_radius_nm:
    description: Keep only aircraft within this many nm of the airport (near-field).
    default: "100"
  backfill_hours:
    description: 'UTC hour range to include, e.g. "10-04" (wraps). Blank = all 24 h.'
    default: ""

  # --- Gold build (src/build_gold.py + resources/skywatch.gold.job.yml) ---
  gold_mode:
    description: >-
      full = rebuild every Gold table from all history (incl. training tables); run before a
      retrain. serving = only the recent slice of the live tables via REPLACE WHERE, skips the
      training tables — set this for the scheduled behind-the-poller run.
    default: "full"
  gold_serving_hours:
    description: serving mode — how many hours back from now to rewrite.
    default: "6"
  gold_serving_anchor_ts:
    description: serving mode — pin "now" to a real timestamp for validation (blank = current time).
    default: ""

  # --- Model 1: time-to-touchdown (src/train_eta.py) ---
  eta_test_date:
    description: Held-out test day for Model 1 (the most recent backfill day).
    default: "2026-09-01"
  eta_max_evals:
    description: Hyperopt trials for Model 1 tuning.
    default: "24"
  eta_ab_table_version:
    description: >-
      Delta version of gold_arrival_tracks to A/B against (the pre-closure-fix version).
      Blank = skip the A/B cell. Get it from DESCRIBE HISTORY skywatch.stream.gold_arrival_tracks.
    default: ""

  # --- Model 1 promotion gate (src/promote_eta.py) ---
  eta_holdout_table_version:
    description: >-
      Delta version of gold_arrival_tracks to pin the promotion-gate holdout to (blank =
      current). Pin this once you know a stable version, so re-running the gate later compares
      against identical data.
    default: ""
  eta_min_improvement_pct:
    description: Promote if overall MAE improves by at least this percent vs @champion.
    default: "2.0"
  eta_noise_band_pct:
    description: Also promote if within this percent of @champion (not meaningfully worse).
    default: "1.0"
  eta_max_band_regression_min:
    description: Hold if any distance band's MAE gets worse than this many minutes vs @champion.
    default: "0.15"
  eta_promote_apply:
    description: >-
      "false" = report the gate recommendation only (dry run). "true" = apply it IF the gate
      passes — this is the human-approval step: re-run with this set only after reading the
      report from a prior dry run.
    default: "false"

  # --- Model 2: arrival demand forecast (src/forecast_demand.py) ---
  demand_horizon_bins:
    description: Forecast horizon in 15-min bins (12 = 3 h).
    default: "12"
  demand_cut_bins:
    description: Backtest forecast-start bins per day (comma-separated).
    default: "32,44,56,68,80"
  demand_run_finetune:
    description: Fine-tune Chronos-Bolt (needs GPU + >= ~14 backfill days to be worth it).
    default: "false"
  demand_score_date:
    description: Pin score_demand.py to a real historical day (YYYY-MM-DD) for validation. Blank = today.
    default: ""
  demand_as_of_bin:
    description: Pin score_demand.py's as-of 15-min bin (0-95) for validation. Blank = current time.
    default: ""

  # --- Model 2 promotion gate (src/promote_demand.py) ---
  demand_holdout_table_version:
    description: >-
      Delta version of gold_demand_15m to pin the promotion-gate evaluation to (blank = current).
    default: ""
  demand_min_improvement_pct:
    description: Promote if overall MASE improves by at least this percent vs @champion.
    default: "2.0"
  demand_noise_band_pct:
    description: Also promote if within this percent of @champion (not meaningfully worse).
    default: "1.0"
  demand_max_band_regression_mase:
    description: Hold if any horizon bucket's MASE gets worse than this much vs @champion.
    default: "0.05"
  demand_promote_apply:
    description: >-
      false = report the gate recommendation only (dry run). true = apply it IF the gate
      passes — the human-approval step, same pattern as eta_promote_apply.
    default: "false"

  # --- Model 3: hold-risk classifier (src/train_hold_risk.py) ---
  holdrisk_band_nm:
    description: Decision band (min,max nm) — rows this far out are the training/serving population.
    default: "30,90"
  holdrisk_test_days:
    description: Most-recent collection days held out for the Model 3 evaluation.
    default: "4"

  # --- Notifications ---
  notification_email:
    description: >-
      Where skywatch_monitor's on_failure email goes. Placeholder on purpose — this repo is
      public; override with --var="notification_email=you@example.com" at deploy time (or a
      local, gitignored variable-overrides file) rather than committing a real address here.
    default: "you@example.com"

  # --- Model health monitoring (src/monitor.py) — dev-only, see Track 5 ---
  monitor_drift_window_days:
    description: Recent-data window for drift/performance checks, days.
    default: "7"
  monitor_min_rows_for_drift:
    description: >-
      Skip the drift check below this many rows in either population — PSI on ~10 bins is
      mostly sampling noise below a few hundred rows, and this project's bursty live poller
      often won't have that many recent rows yet. "Insufficient data" is the honest answer.
    default: "200"
  monitor_min_predictions_for_performance:
    description: Skip the performance check below this many matched predictions.
    default: "20"
  monitor_mae_regression_pct:
    description: >-
      Flag performance as significant if rolling MAE is worse than the registered test MAE by
      more than this percent.
    default: "20.0"
  monitor_freshness_stale_hours:
    description: >-
      Flag freshness as significant if the latest live report is older than this. This
      project's poller runs in bursts, not continuously, so this is generous on purpose —
      it's an anomaly check, not an uptime SLA.
    default: "24"
  monitor_pause_status:
    description: >-
      PAUSED or UNPAUSED — the monitor job's own schedule. Deployed PAUSED by default,
      matching this project's pattern of not silently turning on a recurring schedule; the
      plan calls for this one to actually run live (low-frequency) once you're ready for it.
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      # <-- PASTE your Databricks Free Edition workspace URL here
      # (Profile 'skywatch' created by `databricks auth login` also supplies this.)
      host: https://dbc-0fadb959-36a9.cloud.databricks.com
