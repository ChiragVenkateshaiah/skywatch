# SkyWatch (staging) — Model 2 batch scoring job (arrival demand forecast).
# Reads prod's real gold_touchdowns (read-only), appends to staging's own
# skywatch_staging.stream.demand_forecast.

resources:
  jobs:
    skywatch_score_demand_staging:
      name: skywatch-score-demand-staging
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        project: skywatch
        component: ml
        env: staging

      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ../../src/score_demand.py
            base_parameters:
              stream_schema: ${var.catalog}.${var.stream_schema}
              read_stream_schema: ${var.read_catalog}.${var.stream_schema}
              model_name: ${var.catalog}.ml.demand_forecast
              model_alias: champion
              apt_icao: ${var.apt_icao}
              horizon_bins: ${var.demand_horizon_bins}
              score_date: ${var.demand_score_date}
              as_of_bin: ${var.demand_as_of_bin}

      schedule:
        quartz_cron_expression: "0 9/10 * * * ?"   # every 10 min, offset 9 min past
        timezone_id: UTC
        pause_status: ${var.staging_jobs_pause_status}

      queue:
        enabled: true
