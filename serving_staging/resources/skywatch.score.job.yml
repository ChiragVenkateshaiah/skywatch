# SkyWatch (staging) — Model 1 batch scoring job.
# Reads prod's real gold_tracks/gold_congestion (read-only), scores, appends to staging's own
# skywatch_staging.stream.predictions. Deployed PAUSED — trigger manually until CI (Track 2)
# wires this up.

resources:
  jobs:
    skywatch_score_eta_staging:
      name: skywatch-score-eta-staging
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        project: skywatch
        component: ml
        env: staging

      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ../../src/score_eta.py
            base_parameters:
              stream_schema: ${var.catalog}.${var.stream_schema}
              read_stream_schema: ${var.read_catalog}.${var.stream_schema}
              model_name: ${var.catalog}.ml.eta_touchdown
              model_alias: champion
              max_dist_nm: "120"
              freshness_min: "20"

      schedule:
        quartz_cron_expression: "0 6/10 * * * ?"   # every 10 min, offset 6 min past
        timezone_id: UTC
        pause_status: ${var.staging_jobs_pause_status}

      queue:
        enabled: true
