# SkyWatch (staging) — Arrival Manager App keep-alive.
# Restarts the staging app if Free Edition auto-stopped it. Deployed PAUSED.

resources:
  jobs:
    skywatch_app_keepalive_staging:
      name: skywatch-app-keepalive-staging
      max_concurrent_runs: 1
      timeout_seconds: 900
      tags:
        project: skywatch
        component: app
        env: staging

      tasks:
        - task_key: keepalive
          notebook_task:
            notebook_path: ../../src/restart_app.py
            base_parameters:
              app_name: skywatch-arrmgr-staging

      schedule:
        quartz_cron_expression: "0 0 */8 * * ?"   # every 8 h
        timezone_id: UTC
        pause_status: ${var.staging_jobs_pause_status}

      queue:
        enabled: true
