# SkyWatch — Serving (staging environment)
#
# A SEPARATE Databricks Asset Bundle from the root ../databricks.yml, on purpose: Free Edition
# allows only one active Lakeflow pipeline per workspace, and DAB has no way to exclude a
# resource from a single target — confirmed by testing `resources.pipelines.x: null` under a
# scratch target: `bundle validate` accepted it silently, but the resolved resource graph still
# had the pipeline, fully intact. Sharing databricks.yml with the poller/pipeline/backfill/gold
# resources would mean this target tries to create a SECOND pipeline and fails outright.
# See docs/MLOPS_PLAN.md Track 3 for the full writeup.
#
# This bundle owns only the train/score jobs + the App — resources that are safe to run
# against an isolated catalog. It reads real prod Gold tables read-only (read_catalog) and
# writes its own predictions/models into a separate catalog (catalog). dev's copies of these
# same resources stay in the ROOT databricks.yml, untouched — moving them here would change
# their Databricks-side identity (state is tracked by bundle name + target) and re-create the
# App under a new name, issuing a new URL and breaking the one already shared publicly.
#
# Deploy:  databricks bundle deploy -t staging --var="staging_run_as=<sp-application-id>"
#
# Needs, before it can deploy (none of this exists yet — see docs/MLOPS_PLAN.md Track 3):
#   - the `skywatch_staging` catalog + `ml` / `stream` schemas created
#   - a service principal, granted:
#       GRANT USE CATALOG ON CATALOG skywatch TO `<sp>`;              -- read prod, read-only
#       GRANT USE SCHEMA, SELECT ON SCHEMA skywatch.stream TO `<sp>`;
#       GRANT USE SCHEMA, SELECT ON SCHEMA skywatch.ml TO `<sp>`;
#       GRANT USE CATALOG, CREATE SCHEMA ON CATALOG skywatch_staging TO `<sp>`;  -- own staging
#   - that SP's application id, passed as the `staging_run_as` variable

bundle:
  name: skywatch-serving-staging

include:
  - resources/*.yml

sync:
  # This bundle's resources reference ../../src/*.py and ../../app/ (shared with the root
  # bundle) — sync.paths is the documented DAB mechanism for syncing folders outside the
  # bundle root; without it, `bundle validate` rejects those notebook_path references outright
  # ("not contained in sync root path").
  paths:
    - ../src
    - ../app

variables:
  # --- Unity Catalog layout — deliberately two different catalogs ---
  catalog:
    description: >-
      Staging's OWN catalog — write target for predictions/models/scoring output. Must never
      equal read_catalog.
    default: skywatch_staging
  read_catalog:
    description: >-
      The catalog staging reads Gold tables from, read-only. Points at prod's real data —
      staging never runs its own poller/pipeline/gold (see the header note above).
    default: skywatch
  stream_schema:
    description: Schema for staging's own scoring output, under `catalog`.
    default: stream

  # --- Target airport (same physical airport as prod; isolated data) ---
  apt_icao:
    description: ICAO code of the target airport.
    default: KATL
  apt_lat:
    description: Airport reference latitude.
    default: "33.6407"
  apt_lon:
    description: Airport reference longitude.
    default: "-84.4277"
  apt_elev_ft:
    description: Airport field elevation, ft (KATL = 1026).
    default: "1026"
  apt_aar_per_hour:
    description: Airport Acceptance Rate, arrivals/hour — the App's surge threshold.
    default: "90"

  # --- Arrival Manager App + jobs ---
  warehouse_id:
    description: SQL warehouse staging's App + jobs read through.
    default: "8fd481cbf45ac93e"

  # --- Model 1: time-to-touchdown ---
  eta_test_date:
    description: Held-out test day for a staging retrain (rarely needed — staging usually just scores).
    default: "2026-09-01"
  eta_max_evals:
    description: Hyperopt trials for a staging retrain.
    default: "24"
  eta_ab_table_version:
    description: Blank = skip the A/B cell (staging has no reason to run this).
    default: ""
  eta_holdout_table_version:
    description: Delta version of gold_arrival_tracks to pin the gate holdout to (blank = current).
    default: ""
  eta_min_improvement_pct:
    description: Promote if overall MAE improves by at least this percent vs @champion.
    default: "2.0"
  eta_noise_band_pct:
    description: Also promote if within this percent of @champion (not meaningfully worse).
    default: "1.0"
  eta_max_band_regression_min:
    description: Hold if any distance band's MAE gets worse than this many minutes vs @champion.
    default: "0.15"
  eta_promote_apply:
    description: >-
      false = dry run (report only). true = apply the promotion, if the gate passes.
    default: "false"

  # --- Model 2: arrival demand forecast ---
  demand_horizon_bins:
    description: Forecast horizon in 15-min bins (12 = 3 h).
    default: "12"
  demand_cut_bins:
    description: Backtest forecast-start bins per day (comma-separated).
    default: "32,44,56,68,80"
  demand_run_finetune:
    description: Fine-tune Chronos-Bolt — leave false in staging (needs GPU).
    default: "false"
  demand_score_date:
    description: Pin score_demand.py to a real historical day for validation. Blank = today.
    default: ""
  demand_as_of_bin:
    description: Pin score_demand.py's as-of 15-min bin. Blank = current time.
    default: ""

  # --- Model 3: hold-risk classifier (dormant — see train_hold_risk.py) ---
  holdrisk_band_nm:
    description: Decision band (min,max nm).
    default: "30,90"
  holdrisk_test_days:
    description: Most-recent days held out for evaluation.
    default: "4"

  # --- CI / identity / schedule ---
  staging_run_as:
    description: >-
      Application ID of the service principal CI deploys as (Track 2 prerequisite). No usable
      default — must be passed explicitly (--var, or a target variable file) before
      `bundle deploy -t staging` will work.
    default: ""
  staging_jobs_pause_status:
    description: PAUSED or UNPAUSED — staging's job schedules on deploy. Starts PAUSED.
    default: PAUSED

targets:
  staging:
    mode: production
    workspace:
      host: https://dbc-0fadb959-36a9.cloud.databricks.com
      # NOT a personal user folder — this bundle deploys as the CI service principal, which
      # doesn't have write access under /Workspace/Users/<human>/. A shared path keeps this
      # correct regardless of which identity ends up running the deploy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.staging_run_as}
    # Free Edition workspace is single-user (the account owner + this one CI SP) — /Workspace/Shared
    # being readable/writable by "all workspace users" has no realistic blast radius here.
    # Explicit per the CLI's own suggested fix, rather than silently accepting the default.
    permissions:
      - group_name: users
        level: CAN_MANAGE
