# SkyWatch — Gold batch build job.
# Rebuilds the history-dependent Gold tables from silver_positions. Serverless.
# Deployed PAUSED.
#
#   mode=full  (default): full CREATE OR REPLACE of every table, incl. the training tables.
#              Run ad hoc before a retrain / after a backfill:
#                databricks bundle run skywatch_gold -t dev
#   mode=serving: only the last few hours of the live-serving tables via REPLACE WHERE;
#              skips gold_arrival_tracks / gold_demand_15m. For the scheduled run behind
#              the poller — set it at deploy time:
#                databricks bundle deploy -t dev --var="gold_mode=serving"

resources:
  jobs:
    skywatch_gold:
      name: skywatch-gold
      max_concurrent_runs: 1
      tags:
        project: skywatch
        component: gold

      tasks:
        - task_key: build_gold
          notebook_task:
            notebook_path: ../src/build_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.stream_schema}
              apt_elev_ft: ${var.apt_elev_ft}
              mode: ${var.gold_mode}
              serving_hours: ${var.gold_serving_hours}
              serving_anchor_ts: ${var.gold_serving_anchor_ts}

      schedule:
        quartz_cron_expression: "0 3/10 * * * ?"   # every 10 min, offset 3 min past
        timezone_id: UTC
        pause_status: ${var.poller_pause_status}

      queue:
        enabled: true
