# SkyWatch — Model 3 live irregularity flags (rule-based early-warning).
# No model load; runs a few minutes behind the poller / gold-serving cadence.
#   databricks bundle run skywatch_score_irregularities -t dev
# Deployed PAUSED (same as the other scoring jobs).

resources:
  jobs:
    skywatch_score_irregularities:
      name: skywatch-score-irregularities
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tags:
        project: skywatch
        component: ml

      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ../src/score_irregularities.py
            base_parameters:
              stream_schema: ${var.catalog}.${var.stream_schema}
              apt_icao: ${var.apt_icao}
              apt_elev_ft: ${var.apt_elev_ft}

      schedule:
        quartz_cron_expression: "0 7/10 * * * ?"   # every 10 min, offset 7 min past
        timezone_id: UTC
        pause_status: ${var.poller_pause_status}

      queue:
        enabled: true
