# SkyWatch — Model 2 batch scoring job (arrival demand forecast).
# Serverless. Loads demand_forecast@champion, scores the running day's demand, appends to
# skywatch.stream.demand_forecast. On demand for now:
#   databricks bundle run skywatch_score_demand -t dev
# For validation against a real historical day (no fresh live collection needed):
#   databricks bundle run skywatch_score_demand -t dev --var="demand_score_date=2026-09-01" --var="demand_as_of_bin=48"

resources:
  jobs:
    skywatch_score_demand:
      name: skywatch-score-demand
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        project: skywatch
        component: ml

      tasks:
        - task_key: score
          notebook_task:
            notebook_path: ../src/score_demand.py
            base_parameters:
              stream_schema: ${var.catalog}.${var.stream_schema}
              model_name: ${var.catalog}.ml.demand_forecast
              model_alias: champion
              apt_icao: ${var.apt_icao}
              horizon_bins: ${var.demand_horizon_bins}
              score_date: ${var.demand_score_date}
              as_of_bin: ${var.demand_as_of_bin}

      schedule:
        quartz_cron_expression: "0 9/10 * * * ?"   # every 10 min, offset 9 min past
        timezone_id: UTC
        pause_status: ${var.poller_pause_status}

      queue:
        enabled: true
