# SkyWatch — Model 2 promotion gate.
# Evaluates @challenger vs @champion (MASE, by horizon bucket) and reports a promote/hold
# recommendation. Never flips @champion on its own — see src/promote_demand.py.
#   databricks bundle run skywatch_promote_demand -t dev                                 # dry run
#   databricks bundle run skywatch_promote_demand -t dev --var="demand_promote_apply=true"  # apply

resources:
  jobs:
    skywatch_promote_demand:
      name: skywatch-promote-demand
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tags:
        project: skywatch
        component: ml

      tasks:
        - task_key: promote
          notebook_task:
            notebook_path: ../src/promote_demand.py
            base_parameters:
              stream_schema: ${var.catalog}.${var.stream_schema}
              model_name: ${var.catalog}.ml.demand_forecast
              holdout_table_version: ${var.demand_holdout_table_version}
              cut_bins: ${var.demand_cut_bins}
              min_improvement_pct: ${var.demand_min_improvement_pct}
              noise_band_pct: ${var.demand_noise_band_pct}
              max_band_regression_mase: ${var.demand_max_band_regression_mase}
              apply: ${var.demand_promote_apply}

      queue:
        enabled: true
