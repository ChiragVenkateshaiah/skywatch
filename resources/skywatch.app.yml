# SkyWatch — Arrival Manager (Databricks App, Streamlit).
# Serves Model 1 (arrival sequence) + Model 2 (3 h demand forecast vs AAR) from the
# Delta tables the scoring jobs write. Free Edition: max 3 apps, auto-stops 24 h after
# start/deploy.
#
#   databricks bundle deploy -t dev
#   databricks bundle run skywatch_arrival_manager -t dev      # (re)start it
#
# One-time grant so the app service principal can read the serving tables
# (run in a SQL editor as metastore admin, sp name shown in the app's page after deploy):
#   GRANT USE CATALOG ON CATALOG skywatch TO `<app-service-principal>`;
#   GRANT USE SCHEMA, SELECT ON SCHEMA skywatch.stream TO `<app-service-principal>`;

resources:
  apps:
    skywatch_arrival_manager:
      name: skywatch-arrival-manager
      description: >-
        SkyWatch Arrival Manager — live predicted arrival sequence (Model 1) and the
        next-3 h 15-min arrival demand forecast vs the Airport Acceptance Rate (Model 2)
        for KATL.
      source_code_path: ../app
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
