# SkyWatch — Arrival Manager (Databricks App, Streamlit).
# Serves Model 1 (arrival sequence + live map + click-to-predict), Model 2 (3 h demand
# forecast vs AAR) and Model 3 (rule-based irregularity flags) from the Delta tables the
# scoring jobs write. Free Edition: max 3 apps, auto-stops 24 h after start/deploy —
# `skywatch_app_keepalive` restarts it.
#
#   databricks bundle deploy -t dev
#   databricks bundle run skywatch_arrival_manager -t dev      # (re)start it
#
# One-time grants for the app service principal (SQL editor, as metastore admin; the sp
# name is on the app's page after deploy):
#   GRANT USE CATALOG ON CATALOG skywatch TO `<app-service-principal>`;
#   GRANT USE SCHEMA, SELECT ON SCHEMA skywatch.stream TO `<app-service-principal>`;
#   GRANT USE SCHEMA ON SCHEMA skywatch.ml TO `<app-service-principal>`;
#   GRANT READ VOLUME ON VOLUME skywatch.ml.models TO `<app-service-principal>`;  -- click-to-predict
#   GRANT USE SCHEMA, EXECUTE ON SCHEMA skywatch.chat TO `<app-service-principal>`;  -- chat tools (docs/CHAT_PLAN.md)
#   GRANT SELECT, MODIFY ON TABLE skywatch.chat.chat_audit TO `<app-service-principal>`;  -- chat audit + feedback
#   GRANT SELECT ON TABLE skywatch.chat.doc_chunks TO `<app-service-principal>`;  -- search_docs (CHAT-2)
#
# click-to-predict loads the model from that Volume (src/score_eta.py exports it there every
# run), not the UC Model Registry — GRANT EXECUTE ON MODEL isn't available on this metastore
# (confirmed: `REGISTERED_MODEL is not enabled`, both via SQL and the Grants API).

resources:
  apps:
    skywatch_arrival_manager:
      name: skywatch-arrival-manager
      description: >-
        SkyWatch Arrival Manager for KATL — Model 1 (arrival sequence, live map,
        in-process click-to-predict), Model 2 (next-3 h demand forecast vs AAR),
        Model 3 (rule-based irregularity flags).
      source_code_path: ../app
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # Chat with SkyWatch (docs/CHAT_PLAN.md): the chat model, its fallback, and Genie
        - name: chat-endpoint
          serving_endpoint:
            name: ${var.chat_endpoint}
            permission: CAN_QUERY
        - name: chat-fallback-endpoint
          serving_endpoint:
            name: ${var.chat_fallback_endpoint}
            permission: CAN_QUERY
        - name: embedding-endpoint        # search_docs embeds the query (CHAT-2)
          serving_endpoint:
            name: databricks-gte-large-en
            permission: CAN_QUERY
        - name: genie-space
          genie_space:
            name: SkyWatch — KATL Arrival Manager
            space_id: ${var.chat_genie_space_id}
            permission: CAN_RUN
        # "Get SkyWatch ready" button on the chat page (roadmap DATA-2b) — a human action;
        # the chat model only gets the read-only refresh_status tool
        - name: demo-refresh-job
          job:
            id: ${resources.jobs.skywatch_demo_refresh.id}
            permission: CAN_MANAGE_RUN
      # Overrides app/app.yaml's env at deploy time — files under source_code_path aren't
      # bundle-variable-substituted, so this is how catalog/schema/airport config actually
      # varies per target (docs/MLOPS_PLAN.md Track 3). app/app.yaml keeps the same literal
      # values as plain fallback defaults for `streamlit run app.py` outside a bundle deploy.
      config:
        env:
          - name: SKYWATCH_WAREHOUSE_ID
            value_from: warehouse
          - name: SKYWATCH_CATALOG
            value: ${var.catalog}
          - name: SKYWATCH_SCHEMA
            value: ${var.stream_schema}
          - name: SKYWATCH_APT_ICAO
            value: ${var.apt_icao}
          - name: SKYWATCH_APT_LAT
            value: ${var.apt_lat}
          - name: SKYWATCH_APT_LON
            value: ${var.apt_lon}
          - name: SKYWATCH_AAR_PER_HOUR
            value: ${var.apt_aar_per_hour}
          - name: SKYWATCH_CHAT_ENDPOINT
            value_from: chat-endpoint
          - name: SKYWATCH_CHAT_FALLBACK_ENDPOINT
            value_from: chat-fallback-endpoint
          - name: SKYWATCH_GENIE_SPACE_ID
            value_from: genie-space
          - name: SKYWATCH_REFRESH_JOB_ID
            value_from: demo-refresh-job
