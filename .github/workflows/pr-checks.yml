name: PR checks

# docs/MLOPS_PLAN.md Track 2. Runs pytest + ruff on every PR (no Databricks credentials
# needed), then `bundle validate` against both bundles (needs the skywatch-ci service
# principal — see Track 3). On a PR from a fork, GitHub withholds repo secrets by design, so
# the validate job's Databricks CLI steps will fail there; that's expected on a public repo,
# not a bug — see docs/MLOPS_PLAN.md Track 2's SP-OAuth-first / PAT-fallback note.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src app tests serving_staging

      - name: Test
        run: pytest tests/ -q

  validate:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/cli/main/install.sh | sh

      - name: Validate root bundle (dev)
        run: databricks bundle validate -t dev

      - name: Validate serving_staging bundle (staging)
        working-directory: serving_staging
        run: databricks bundle validate -t staging --var="staging_run_as=${{ secrets.DATABRICKS_CLIENT_ID }}"
